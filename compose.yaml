services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hse_reviews
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hse_reviews"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
