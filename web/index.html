<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ОтзоВышка</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1>ОтзоВышка</h1>
        <div class="auth-controls">
            <a id="login-link" class="button" href="/auth/login" hidden>Войти</a>
            <button id="my-reviews-button" class="button" type="button" hidden>Мои отзывы</button>
            <button id="logout-button" class="button" type="button" hidden>Выйти</button>
        </div>
    </header>
    <p id="auth-message" class="auth-message" role="status">Проверяем вход…</p>
    <main id="content" class="content" hidden>
        <section id="catalog">
            <h2 id="catalog-title" tabindex="-1">Каталог майноров</h2>
            <p id="catalog-message" class="catalog-message" role="status"></p>
            <ul id="minors-list" class="minors-list"></ul>
        </section>
        <section id="minor-details" hidden>
            <button id="back-to-catalog" class="button" type="button">Назад к каталогу</button>
            <h2 id="minor-name" tabindex="-1"></h2>
            <a id="minor-link" target="_blank" rel="noopener noreferrer" hidden>Страница на сайте ВШЭ</a>
            <h3>Опубликованные отзывы</h3>
            <p id="minor-message" class="minor-message" role="status"></p>
            <ul id="reviews-list" class="reviews-list"></ul>
        </section>
        <section id="my-reviews" hidden>
            <button id="my-reviews-back" class="button" type="button">Назад к каталогу</button>
            <h2 id="my-reviews-title" tabindex="-1">Мои отзывы</h2>
            <p id="my-reviews-message" class="my-reviews-message" role="status"></p>
            <ul id="my-reviews-list" class="reviews-list"></ul>
        </section>
    </main>
</body>
</html>
